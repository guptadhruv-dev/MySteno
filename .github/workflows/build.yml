name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('MySteno.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build
        run: >
          xcodebuild build
          -project MySteno.xcodeproj
          -scheme MySteno
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath DerivedData
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
